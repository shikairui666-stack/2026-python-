<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}音乐网站{% endblock %}</title>
</head>
<body>
    <a href="{% url 'song_list' %}">歌曲列表</a> |
    <a href="{% url 'artist_list' %}">歌手列表</a>
    <form action="{% url 'search' %}" method="get">
        <input type="text" name="q" maxlength="20" placeholder="搜索关键词">
        <label><input type="radio" name="type" value="song" checked>歌曲</label>
        <label><input type="radio" name="type" value="artist">歌手</label>
        <button>搜索</button>
    </form>
    <hr>
    {% block content %}{% endblock %}
</body>
</html>
